stages:
  - check

default:
  image: python:3.12-alpine

# `README.md` is generated from `catalog/`; this job is the thing that makes that
# true rather than merely stated. It runs on every ref a change can arrive on —
# merge request, `main`, tag — and never on a schedule, because nothing here
# changes with time: the catalog is a pure function and so is its output.
#
# The publishing project runs `--write` and commits README.md with its entry, so
# this job *confirms* rather than regenerates. See CONTRIBUTING.md.
catalog-check:
  stage: check
  tags:
    - linux
    - x86_64
    - container
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - catalog/**/*
        - tools/**/*
        - README.md
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - catalog/**/*
        - tools/**/*
        - README.md
    - if: '$CI_COMMIT_TAG'
  script:
    - python3 tools/build_catalog.py --check
